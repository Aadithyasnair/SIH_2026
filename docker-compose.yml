services:
  postgres:
    image: postgres:15-alpine
    container_name: sih26146-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_bitcoin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_bitcoin"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: sih26146-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/sih_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sih26146-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sih_user:sih_password@postgres:5432/sih_bitcoin
      GEOIP_PATH: /app/shared/geoip
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
      - ./ml_detection/models:/app/ml_detection/models

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sih26146-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
